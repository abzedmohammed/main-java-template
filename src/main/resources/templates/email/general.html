<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="color-scheme" content="light only"/>
<title>{{title}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f7f9fb;font-family:'Geist',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;color:#191c1e;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f7f9fb;">
<tr>
<td align="center" style="padding:24px 16px;">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:600px;max-width:100%;">
<!-- Header -->
<tr>
<td style="padding:16px 24px;background-color:#ffffff;border:1px solid #c6c6cd;border-bottom:none;border-radius:12px 12px 0 0;font-size:22px;font-weight:700;letter-spacing:-0.02em;color:#0f172a;">{{appName}}</td>
</tr>
<!-- Card -->
<tr>
<td style="background-color:#ffffff;border:1px solid #c6c6cd;border-top:none;border-radius:0 0 12px 12px;overflow:hidden;">
<!-- Hero -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0">
<tr>
<td align="center" style="padding:32px;">
<table role="presentation" cellpadding="0" cellspacing="0" align="center" style="margin:0 auto 24px auto;">
<tr>
<td style="background-color:#0f172a;color:#ffffff;padding:6px 14px;border-radius:9999px;font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;">&#128274; Secure Communication</td>
</tr>
</table>
<h1 style="margin:0 0 16px 0;font-size:32px;line-height:40px;font-weight:600;letter-spacing:-0.01em;color:#191c1e;">{{title}}</h1>
<p style="margin:0 0 32px 0;font-size:18px;line-height:28px;color:#45464d;">{{body}}</p>
<table role="presentation" cellpadding="0" cellspacing="0" align="center" style="margin:0 auto;">
<tr>
<td style="background-color:#0f172a;border-radius:9999px;">
<a href="{{ctaUrl}}" style="display:inline-block;padding:14px 40px;font-size:16px;font-weight:600;color:#ffffff;text-decoration:none;">{{ctaLabel}}</a>
</td>
</tr>
</table>
</td>
</tr>
</table>
<!-- Feature detail -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f2f4f6;border-top:1px solid #c6c6cd;">
<tr>
<td style="padding:24px;">
<table role="presentation" cellpadding="0" cellspacing="0">
<tr>
<td valign="top" style="width:40px;">
<div style="width:40px;height:40px;border-radius:8px;background-color:#8b5cf6;color:#ffffff;text-align:center;line-height:40px;font-size:18px;">&#128101;</div>
</td>
<td valign="top" style="padding-left:16px;">
<h3 style="margin:0 0 4px 0;font-size:14px;font-weight:600;color:#191c1e;">{{featureTitle}}</h3>
<p style="margin:0;font-size:14px;line-height:20px;color:#45464d;">{{featureBody}}</p>
</td>
</tr>
</table>
</td>
</tr>
</table>
<!-- Accent bar -->
<div style="height:4px;background:linear-gradient(to right,#4f46e5,#8b5cf6,#10b981);font-size:0;line-height:0;">&nbsp;</div>
</td>
</tr>
<!-- Footer -->
<tr>
<td style="padding:32px 24px;text-align:center;">
<div style="font-size:14px;font-weight:700;color:#191c1e;">{{appName}}</div>
<div style="margin-top:16px;">
<a href="#" style="margin:0 8px;font-size:12px;font-weight:600;color:#45464d;text-decoration:none;">Privacy Policy</a>
<a href="#" style="margin:0 8px;font-size:12px;font-weight:600;color:#45464d;text-decoration:none;">Terms of Service</a>
<a href="#" style="margin:0 8px;font-size:12px;font-weight:600;color:#45464d;text-decoration:none;">Unsubscribe</a>
<a href="#" style="margin:0 8px;font-size:12px;font-weight:600;color:#45464d;text-decoration:none;">Contact Support</a>
</div>
<p style="margin:16px 0 0 0;font-size:12px;color:#45464d;">&copy; {{year}} {{appName}}.</p>
</td>
</tr>
</table>
</td>
</tr>
</table>
</body>
</html>
