spring:
  application:
    name: main-java-template

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/main_java_template}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:false}

app:
  auth:
    jwt:
      access-secret: ${APP_JWT_ACCESS_SECRET:replace-with-base64-secret}
      access-minutes: ${APP_JWT_ACCESS_MINUTES:15}
    otp:
      # Also returned to the client as `otpTimer` (minutes) on sign_up / sign_in / reset_password.
      ttl-minutes: ${APP_OTP_TTL_MINUTES:5}
      max-attempts: ${APP_OTP_MAX_ATTEMPTS:5}
      # Server-side HMAC key for hashing OTPs (>= 32 chars, never committed). Required at startup.
      secret: ${APP_OTP_SECRET:}
    login:
      max-attempts: ${APP_LOGIN_MAX_ATTEMPTS:5}
      lock-minutes: ${APP_LOGIN_LOCK_MINUTES:15}
    social:
      enabled: ${APP_SOCIAL_AUTH_ENABLED:false}

  # Used in email templates ({{appName}}, {{supportEmail}}, CTA link).
  name: ${APP_NAME:Main Java Template}
  support-email: ${APP_SUPPORT_EMAIL:support@example.com}

  frontend:
    login-url: ${APP_FRONTEND_LOGIN_URL:http://localhost:5173/login}
    oauth-success-url: ${APP_FRONTEND_OAUTH_SUCCESS_URL:http://localhost:5173/oauth/success}

  mail:
    from: ${APP_MAIL_FROM:no-reply@main-java-template.local}

  rabbitmq:
    enabled: ${APP_RABBITMQ_ENABLED:false}

  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:*}

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /swagger-ui
